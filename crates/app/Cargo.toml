[package]
name = "textora-app"
version = "0.1.0"

edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "textora"
path = "src/main.rs"

[features]
default = ["markdown-rich", "sync"]
ci-no-fonts = ["appkit-shell/ci-no-fonts"]
markdown = ["dep:textora-markdown", "dep:textora-mindmap", "appkit-shell/rich-clipboard"]
markdown-rich = ["markdown", "textora-markdown/rich-markdown"]
sync = ["dep:textora-sync", "dep:semver", "dep:security-framework", "dep:security-framework-sys"]

[dependencies]
unicode_categories = { workspace = true }
ui.workspace = true
winit.workspace = true
wgpu.workspace = true
shaping.workspace = true
textora-markdown = { path = "../markdown", optional = true, default-features = false }
textora-mindmap = { path = "../mindmap", optional = true }
appkit-core = { path = "../appkit-core", package = "textora-appkit-core" }
appkit-shell = { path = "../appkit-shell", package = "textora-appkit-shell", default-features = false }
render.workspace = true
pollster = "0.4"
textora_core.workspace = true
stdext.workspace = true
serde = { workspace = true }
toml = "0.5"
hashlink.workspace = true
rfd = { version = "0.15", default-features = false }
similar = "2"
blake3 = "1"
dirs = "6"
smallvec = { workspace = true }
textora-sync = { path = "../sync", optional = true }
semver = { version = "1", optional = true }
notify = "8"
file-watch = { package = "textora-file-watch", path = "../file-watch" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
security-framework = { version = "3.7", optional = true }
security-framework-sys = { version = "2.17", optional = true }
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { workspace = true, features = ["vulkan"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, features = ["dx12", "vulkan"] }
image = { version = "0.25", default-features = false, features = ["ico"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
bytemuck = "1"
tempfile = "3"
criterion = { workspace = true }
syn = { version = "2", features = ["full", "visit"] }

[[bench]]
name = "tab_bench"
harness = false

[[bench]]
name = "scroll_bench"
harness = false

[[bench]]
name = "snap_tree_bench"
harness = false
