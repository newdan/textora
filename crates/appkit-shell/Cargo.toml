[package]
name = "textora-appkit-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "appkit_shell"
path = "src/lib.rs"

[features]
ci-no-fonts = []

[dependencies]
accesskit = "0.24.1"
accesskit_winit = { version = "0.33.2", default-features = false, features = ["rwh_06"] }
appkit-core = { path = "../appkit-core", package = "textora-appkit-core" }
core.workspace = true
ui.workspace = true
winit.workspace = true
wgpu.workspace = true
render.workspace = true
shaping.workspace = true
stdext.workspace = true
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
hashlink.workspace = true
smallvec.workspace = true
unicode_categories.workspace = true
clipboard-rs.workspace = true
url.workspace = true
