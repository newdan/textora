[package]
name = "textora-appkit-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "appkit_shell"
path = "src/lib.rs"

[features]
default = ["rich-clipboard"]
ci-no-fonts = []
rich-clipboard = ["clipboard-rs/image", "dep:url"]

[dependencies]
accesskit = "0.24.1"
accesskit_winit = { version = "0.33.2", default-features = false, features = ["rwh_06"] }
appkit-core = { path = "../appkit-core", package = "textora-appkit-core" }
textora_core.workspace = true
ui.workspace = true
winit.workspace = true
wgpu.workspace = true
render.workspace = true
shaping.workspace = true
stdext.workspace = true
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
hashlink.workspace = true
smallvec.workspace = true
unicode_categories.workspace = true
clipboard-rs.workspace = true
url = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CABase", "CADisplayLink", "CAFrameRateRange", "objc2-core-foundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, features = ["gles", "dx12"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_DirectComposition", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
