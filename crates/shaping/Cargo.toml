[package]
name = "textora-shaping"
version = "0.0.0"

edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "shaping"
path = "src/lib.rs"

[dependencies]
cosmic-text = { workspace = true }
ttf-parser = "0.21"
hashlink.workspace = true
swash = "0.1.19"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
sys-locale = "0.3"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "shaping_bench"
harness = false

[[bench]]
name = "font_cache_bench"
harness = false
